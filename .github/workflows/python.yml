name: python

on:
  push:
    paths: ["backend/**", "scripts/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["backend/**", "scripts/**", ".github/workflows/python.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "backend[test]"
      - run: python scripts/check_layers.py
      - run: pytest backend/tests
      - run: python -c "from konwhub.api.app import create_app; app=create_app(); assert any(r.path.endswith('/health/live') for r in app.routes)"
        env:
          PYTHONPATH: backend
