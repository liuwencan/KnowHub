[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "konwhub"
version = "0.1.0"
description = "Python LangChain migration runtime for KnowHub"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "celery[redis]==5.4.0",
  "fastapi==0.115.6",
  "langchain-core==0.3.28",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "pymysql==1.1.1",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0"
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.4", "pytest-asyncio==0.25.0"]

[project.scripts]
konwhub-api = "konwhub.api.main:main"
konwhub-worker = "konwhub.workers.celery_app:main"

[tool.hatch.build.targets.wheel]
packages = ["konwhub"]

[tool.pytest.ini_options]
testpaths = ["../tests", "tests"]
addopts = "-q"
